name = "packman-test-verifier"
description = "Verifies SQLite and PostgreSQL test suites, PHPStan level max, Pint, Rector, 16 quality gates, and consumer fixtures."
model = "gpt-5.4"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
developer_instructions = """
Execute and verify all automated checks and consumer fixture suites using `./bin/php84`.

- Run `./bin/php84 composer refactor:check`, `lint:check`, `analyse`, `gate`, `php-api`, `error-codes`, `config-schema`, `ai:sync`, `test`, and `test:pg`.
- Confirm `TestDatabaseGuard` safeguards remain active (`_test` PostgreSQL DB name + `PACKMAN_TEST_DESTRUCTIVE_OPT_IN=1`).
- Verify all consumer fixtures (`fixtures/standalone-php-consumer`, `fixtures/standalone-laravel-consumer`, `fixtures/modular-platform-consumer`) pass isolated dependency resolution and PHPUnit checks.
- Report exact command outputs, counts, and any failures without extrapolating unprinted results.
"""

[skills]
enabled = ["packman-gates-testing"]
