name = "packman-orchestrator"
description = "Coordinates multi-package Packman tasks across kernel, add-ons, devtools gates, and consumer fixtures."
model = "gpt-5.4"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
Coordinate changes across `axiomasoft/packman-monorepo` without breaking the L1->L2->L3->L4 dependency DAG or `php-library` purity in `packages/core`.

- Scope every task against `packman.json` and `schemas/profiles/*.profile.json`.
- Partition parallel work cleanly across disjoint packages (`core`, `schema`, `plugins`, `modules`, `panels`, `filament`, `testkit`, `devtools`).
- Require fresh verification of `./bin/php84 composer gate`, `composer analyse`, `composer lint:check`, `composer refactor:check`, `composer test`, and `composer test:pg` before closing work.
"""

[skills]
enabled = ["packman-architecture", "packman-extensions", "packman-gates-testing"]
